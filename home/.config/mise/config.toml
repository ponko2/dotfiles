[bootstrap.hooks]
post-defaults = "killall Dock Finder SystemUIServer 2> /dev/null || true"

[bootstrap.macos.defaults]
".GlobalPreferences" = {
  # マウス軌道の速さを最速化
  "com.apple.mouse.scaling" = 3.0,
}
"com.apple.desktopservices" = {
  # ネットワークフォルダに .DS_Store を作成しない
  DSDontWriteNetworkStores = true,
}
"com.apple.dock" = {
  # 自動的に非表示
  autohide = true,
  # 位置を右側に設定
  orientation = "right",
  # 最近使用したアプリケーションを非表しない
  show-recents = false,
}
"com.apple.finder" = {
  # すべてのファイル名拡張子を表示
  AppleShowAllExtensions = true,
  # 検索範囲を現在のフォルダに変更
  FXDefaultSearchScope = "SCcf",
  # 拡張子を変更する際の警告を無効化
  FXEnableExtensionChangeWarning = false,
  # デフォルト表示をリストビューに設定
  FXPreferredViewStyle = "Nlsv",
  # 新規ウィンドウのデフォルト表示をHOMEに設定
  NewWindowTarget = "Home",
  # パスバーを表示
  ShowPathbar = true,
  # ステータスバーを表示
  ShowStatusBar = true,
}
# メニューバーの時計
"com.apple.menuextra.clock" = {
  # 24時間表示に設定
  Show24Hour = true,
}
# スクリーンキャプチャ
"com.apple.screencapture" = {
  # ドロップシャドウを無効化
  disable-shadow = true,
  # スクリーンキャプチャの保存先を変更
  location = "~/Downloads/",
  # スクリーンキャプチャのサムネイル表示を無効化
  show-thumbnail = false,
}
# WindowManager
"com.apple.WindowManager" = {
  # 壁紙クリック時のデスクトップ表示を無効化
  EnableStandardClickToShowDesktop = false,
}
NSGlobalDomain = {
  # F1やF2などのキーを標準のファンクションキーとして使用
  "com.apple.keyboard.fnState" = true,
  # ナチュラルなスクロールを無効化
  "com.apple.swipescrolldirection" = false,
  # アクセント付き文字の「長押し入力」を無効化
  ApplePressAndHoldEnabled = false,
  # すべてのファイル名拡張子を表示
  AppleShowAllExtensions = true,
  # キーリピート開始までの待機時間を最短化
  InitialKeyRepeat = 15,
  # キーリピートの速度を最速化
  KeyRepeat = 2,
  # 自動大文字変換を無効化
  NSAutomaticCapitalizationEnabled = false,
  # スマートダッシュ置換を無効化
  NSAutomaticDashSubstitutionEnabled = false,
  # スマートピリオド置換を無効化
  NSAutomaticPeriodSubstitutionEnabled = false,
  # スマート引用符置換を無効化
  NSAutomaticQuoteSubstitutionEnabled = false,
  # 自動スペル修正を無効化
  NSAutomaticSpellingCorrectionEnabled = false,
  # スペル自動修正を無効化 (WebView)
  WebAutomaticSpellingCorrectionEnabled = false,
}

