name: CI
on:
  merge_group: {}
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  required:
    name: "Required Checks: CI"
    if: ${{ always() }}
    needs:
      - changed-files
      - jactionlint
      - commitlint
      - editorconfig
      - luacheck
      - luals
      - oxfmt
      - ryl
      - selene
      - stylua
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Fail if any required jobs failed or cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
        shell: bash
  changed-files:
    name: Get changed files
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      # reference: https://github.com/tj-actions/changed-files#outputs-
      jactionlint: ${{ steps.changed-files.outputs.jactionlint_any_modified == 'true' }}
      luacheck: ${{ steps.changed-files.outputs.luacheck_any_modified == 'true' }}
      luals: ${{ steps.changed-files.outputs.luals_any_modified == 'true' }}
      ryl: ${{ steps.changed-files.outputs.ryl_any_modified == 'true' }}
      selene: ${{ steps.changed-files.outputs.selene_any_modified == 'true' }}
      stylua: ${{ steps.changed-files.outputs.stylua_any_modified == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 50 # Assume PRs are less than 50 commits
          persist-credentials: true
      - name: Get relevant files changed per group
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
        with:
          files_yaml: |
            common: &common
              - .github/workflows/ci.yml
            dependencies: &dependencies
              - mise.lock
              - mise.toml
            lua: &lua
              - "**/*.lua"
            jactionlint:
              - *dependencies
              - "**/action.{yaml,yml}"
              - ".github/workflows/*.{yaml,yml}"
              - .github/jactionlint.yaml
            luacheck:
              - *common
              - *dependencies
              - *lua
              - .luacheckrc
            luals:
              - *common
              - *dependencies
              - *lua
              - .config/nvim/lazy-lock.json
              - .luarc.json
            ryl:
              - *common
              - *dependencies
              - "**/*.{yaml,yml}"
              - .ryl.toml
            selene:
              - *common
              - *dependencies
              - *lua
              - nvim.yml
              - selene.toml
            stylua:
              - *common
              - *dependencies
              - *lua
              - .stylua.toml
  jactionlint:
    name: jactionlint
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.jactionlint == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: jactionlint,shellcheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Run jactionlint
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JACTIONLINT_ONLINE: 1
        run: jactionlint --format=github --color --strict-exit
        shell: bash
  commitlint:
    name: commitlint
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: npm:@commitlint/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 50 # Assume PRs are less than 50 commits
          filter: blob:none
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Validate all commits from PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        shell: bash
  editorconfig:
    name: EditorConfig
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: editorconfig-checker
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Run EditorConfig checker
        run: editorconfig-checker
        shell: bash
  luacheck:
    name: Luacheck
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.luacheck == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: luarocks:luacheck,lua
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev
        shell: bash
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Run Luacheck
        run: luacheck .
        shell: bash
  luals:
    name: LuaLS
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.luals == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: lua-language-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up XDG Base Directory
        run: |
          {
            echo "XDG_BIN_HOME=$HOME/.local/bin"
            echo "XDG_CACHE_HOME=$HOME/.cache"
            echo "XDG_CONFIG_HOME=$GITHUB_WORKSPACE/.config"
            echo "XDG_DATA_HOME=$HOME/.local/share"
            echo "XDG_STATE_HOME=$HOME/.local/state"
          } >> "$GITHUB_ENV"
        shell: bash
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Restore Neovim plugins
        run: nvim --headless "+Lazy! restore" +qa
        shell: bash
      - name: Run LuaLS
        run: lua-language-server --check .
        shell: bash
  oxfmt:
    name: Oxfmt
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: oxfmt
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Run Oxfmt
        run: oxfmt --check
        shell: bash
  ryl:
    name: ryl
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.ryl == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: aqua:owenlamont/ryl
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Run ryl
        run: ryl --format=github --strict .
        shell: bash
      - name: Run ryl format
        run: ryl format --check --output-format=github .
        shell: bash
  selene:
    name: selene
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.selene == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: aqua:Kampfkarren/selene/light
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Run selene
        run: selene .
        shell: bash
  stylua:
    name: StyLua
    if: ${{ always() && !failure() && !cancelled() &&
      (needs.changed-files.result == 'skipped' || needs.changed-files.outputs.stylua == 'true') }}
    needs: changed-files
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      MISE_ENABLE_TOOLS: stylua
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@v5.2.7
        with:
          cache_key_prefix: mise-v1-${{ github.job }}
      - name: Run StyLua
        run: stylua --allow-hidden --check .
        shell: bash
