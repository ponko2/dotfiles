[settings]
lockfile = true

[tools]
"npm:@commitlint/cli" = "latest"
checkmake = "latest"
editorconfig-checker = "latest"
hk = "latest"
node = "lts"
oxfmt = "latest"
python = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
uv = "latest"

[tools."github:Kampfkarren/selene"]
version = "latest"
bin = "selene"

[tools.lua]
version = "5.1"
postinstall = "luarocks install luacheck"
lazy = true
lazy_bins = ["lua", "luac", "luacheck"]

[tools.yamllint]
version = "latest"
depends = ["python", "uv"]
